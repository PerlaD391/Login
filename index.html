<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema - Panel Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- ==================== SIDEBAR ==================== -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h5 class="mb-0"><i class="fas fa-shield-alt me-2"></i>AdminPanel</h5>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="#" class="sidebar-link" id="toggleUsuarios">
                    <i class="fas fa-users me-2"></i>Usuarios
                    <i class="fas fa-chevron-down ms-auto"></i>
                </a>
                <ul class="sidebar-submenu" id="submenuUsuarios">
                    <li>
                        <a href="#" class="sidebar-sublink" id="linkCaptura">
                            <i class="fas fa-user-plus me-2"></i>Captura
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>

    <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
    <main class="contenido-principal" id="contenidoPrincipal">

        <!-- Sección de bienvenida -->
        <div id="seccionBienvenida" class="seccion">
            <div class="card shadow-sm">
                <div class="card-body text-center p-5">
                    <i class="fas fa-home fa-4x text-primary mb-3"></i>
                    <h2>¡Bienvenido al Sistema!</h2>
                    <p class="text-muted">Selecciona una opción del menú lateral para comenzar.</p>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Pollito890d/ProgramWebActividad2@main/js/utileria.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
